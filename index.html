<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoHolliday Sumenep</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #00D1D1;
            --bg-dark: #070B15;
            --card-dark: #121A2C;
            --text-main: #FFFFFF;
            --text-grey: #94A3B8;
            --danger: #FF4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* --- UI ELEMENTS --- */
        .page { display: none; padding: 20px 20px 100px; animation: slideUp 0.4s ease-out; }
        .active-page { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-top: 10px; }
        .brand-name { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #00D1D1, #00A8FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- CATEGORY PILLS --- */
        .category-scroll { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 20px; background: var(--card-dark); border-radius: 50px; white-space: nowrap; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); color: var(--text-grey); transition: 0.3s; }
        .pill.active { background: var(--primary); color: #000; font-weight: 700; border-color: var(--primary); }

        /* --- TOUR CARDS --- */
        .tour-card { background: var(--card-dark); border-radius: 24px; margin-bottom: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .tour-img { width: 100%; height: 220px; object-fit: cover; }
        .tour-content { padding: 18px; }
        .badge-cat { font-size: 0.65rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .price-label { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 6px 14px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; color: var(--primary); border: 1px solid rgba(0,209,209,0.3); }

        /* --- NAV BAR --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(18, 26, 44, 0.8); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 18px; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { color: var(--text-grey); font-size: 1.4rem; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }

        /* --- PROFILE --- */
        .profile-hero { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #121A2C, transparent); border-radius: 30px; margin-bottom: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 35px; border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }
    </style>
</head>
<body>

    <div id="home" class="page active-page">
        <div class="header">
            <div class="brand-name">GoHolliday</div>
            <img src="https://i.pravatar.cc/150?u=imam" style="width: 40px; height: 40px; border-radius: 12px;">
        </div>
        
        <div class="category-scroll">
            <div class="pill active" onclick="filterData('Semua', this)">Semua</div>
            <div class="pill" onclick="filterData('Pantai', this)">Pantai</div>
            <div class="pill" onclick="filterData('Religi', this)">Religi</div>
            <div class="pill" onclick="filterData('Sejarah', this)">Sejarah</div>
            <div class="pill" onclick="filterData('Alam', this)">Alam</div>
        </div>

        <div id="tourList"></div>
    </div>

    <div id="profile" class="page">
        <div class="profile-hero">
            <img src="https://i.pravatar.cc/150?u=imam" class="avatar">
            <h2 id="userName">Imam Mahdy</h2>
            <p style="color: var(--text-grey); font-size: 0.9rem;">MAMTECH Enthusiast</p>
        </div>
        <div style="background: var(--card-dark); border-radius: 20px; padding: 10px;">
            <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between;">
                <span>Edit Profil</span> <i class="fas fa-chevron-right"></i>
            </div>
            <div style="padding: 15px; color: var(--danger);" onclick="location.reload()">
                <span>Keluar</span> <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="navPage('home', this)"><i class="fas fa-compass"></i></div>
        <div class="nav-item"><i class="fas fa-heart"></i></div>
        <div class="nav-item"><i class="fas fa-bell"></i></div>
        <div class="nav-item" onclick="navPage('profile', this)"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const destinations = [
            { id: 1, name: "Gili Labak", cat: "Pantai", price: "Free*", img: "https://images.unsplash.com/photo-1544735716-392fe2489ffa?w=500" },
            { id: 2, name: "Gili Iyang (Oksigen)", cat: "Alam", price: "Rp 15k", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" },
            { id: 3, name: "Pantai Sembilan", cat: "Pantai", price: "Rp 15k", img: "https://images.unsplash.com/photo-1519046904884-53103b34b206?w=500" },
            { id: 4, name: "Pantai Lombang", cat: "Pantai", price: "Rp 10k", img: "https://images.unsplash.com/photo-1506929199175-609ec3f7717c?w=500" },
            { id: 5, name: "Pantai Slopeng", cat: "Pantai", price: "Rp 10k", img: "https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=500" },
            { id: 6, name: "Museum Keraton", cat: "Sejarah", price: "Rp 5k", img: "https://images.unsplash.com/photo-1625492922105-5914617fd869?w=500" },
            { id: 7, name: "Masjid Agung", cat: "Religi", price: "Free", img: "https://images.unsplash.com/photo-1590076215667-873d38354fe5?w=500" },
            { id: 8, name: "Asta Tinggi", cat: "Religi", price: "Donasi", img: "https://images.unsplash.com/photo-1605648916361-9bc12ad6a569?w=500" },
            { id: 9, name: "Asta Sayyid Yusuf", cat: "Religi", price: "Donasi", img: "https://images.unsplash.com/photo-1597466599360-3b9775841aec?w=500" },
            { id: 10, name: "Bukit Tawap", cat: "Alam", price: "Rp 15k", img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500" },
            { id: 11, name: "Daramista", cat: "Alam", price: "Rp 10k", img: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" },
            { id: 12, name: "Mangrove Kedatim", cat: "Alam", price: "Rp 10k", img: "https://images.unsplash.com/photo-1544161513-0179fe746fd5?w=500" },
            { id: 13, name: "Taman Adipura", cat: "Sejarah", price: "Free", img: "https://images.unsplash.com/photo-1582650625119-3a31f8fa2699?w=500" }
        ];

        function renderList(data) {
            const list = document.getElementById('tourList');
            list.innerHTML = '';
            data.forEach(d => {
                list.innerHTML += `
                    <div class="tour-card">
                        <div class="price-label">${d.price}</div>
                        <img src="${d.img}" class="tour-img">
                        <div class="tour-content">
                            <span class="badge-cat">${d.cat}</span>
                            <h3 style="margin-bottom: 5px;">${d.name}</h3>
                            <p style="font-size: 0.8rem; color: var(--text-grey);"><i class="fas fa-map-marker-alt"></i> Sumenep, Madura</p>
                        </div>
                    </div>
                `;
            });
        }

        function filterData(cat, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'Semua' ? destinations : destinations.filter(d => d.cat === cat);
            renderList(filtered);
        }

        function navPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            el.classList.add('active');
        }

        window.onload = () => renderList(destinations);
    </script>
</body>
</html>
