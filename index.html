<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoHolliday Sumenep - MAMTECH Pro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00D1D1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo-goholiday.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00D1D1;
            --bg-dark: #070B15;
            --card-dark: #121A2C;
            --text-main: #FFFFFF;
            --text-grey: #94A3B8;
            --danger: #FF4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; inset: 0; z-index: 2000; background: radial-gradient(circle at top, #1e293b, #070b15);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
        }
        .btn-google {
            background: white; color: #111; padding: 15px 30px; border-radius: 18px; border: none;
            display: flex; align-items: center; gap: 12px; font-weight: 700; cursor: pointer; margin-top: 40px; width: 100%; max-width: 280px;
        }

        /* --- EDIT MODAL --- */
        #edit-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 3000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px);
        }
        .modal-box { background: var(--card-dark); padding: 30px; border-radius: 28px; width: 100%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--text-grey); margin-bottom: 8px; margin-left: 5px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .input-group input:focus { border-color: var(--primary); }

        /* --- UI ELEMENTS --- */
        .page { display: none; padding: 20px 20px 100px; animation: fadeIn 0.4s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-top: 10px; }
        .brand-name { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #00D1D1, #00A8FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .category-scroll { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 20px; background: var(--card-dark); border-radius: 50px; white-space: nowrap; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); color: var(--text-grey); }
        .pill.active { background: var(--primary); color: #000; font-weight: 700; }

        .tour-card { background: var(--card-dark); border-radius: 24px; margin-bottom: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .tour-img { width: 100%; height: 220px; object-fit: cover; }
        .tour-content { padding: 18px; }
        .price-label { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 6px 14px; border-radius: 12px; font-weight: 700; color: var(--primary); }

        /* --- NAV --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(18, 26, 44, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 18px; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { color: var(--text-grey); font-size: 1.4rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        /* --- PROFILE --- */
        .profile-hero { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #121A2C, transparent); border-radius: 30px; margin-bottom: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 35px; border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }
        .btn-action { width: 100%; padding: 15px; background: #1e293b; color: white; border: none; border-radius: 18px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="width:80px; height:80px; background:var(--primary); border-radius:25px; display:flex; align-items:center; justify-content:center; margin-bottom:20px; box-shadow: 0 10px 30px rgba(0,209,209,0.3);">
            <i class="fas fa-paper-plane" style="font-size:2rem; color:#000;"></i>
        </div>
        <h1 style="font-size:2.2rem; letter-spacing:-1px;">GoHolliday</h1>
        <p style="color:var(--text-grey);">Nikmati liburan di Sumenep bersama MAMTECH</p>
        <button class="btn-google" onclick="handleLogin()">
            <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" width="20">
            Masuk dengan Google
        </button>
    </div>

    <div id="edit-modal">
        <div class="modal-box">
            <h2 style="margin-bottom:20px;">Sunting Profil</h2>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="edit-name" placeholder="Contoh: Imam Mahdi">
            </div>
            <div class="input-group">
                <label>Status / Jabatan</label>
                <input type="text" id="edit-status" placeholder="Contoh: MAMTECH Owner">
            </div>
            <div class="input-group">
                <label>Link Foto Profil (URL)</label>
                <input type="text" id="edit-pic" placeholder="Masukkan link foto">
            </div>
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--primary); color:#000; border:none; border-radius:15px; font-weight:700;">Simpan Perubahan</button>
            <p onclick="closeModal()" style="text-align:center; margin-top:15px; color:var(--text-grey); font-size:0.9rem; cursor:pointer;">Batal</p>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        
        <div id="home" class="page active-page">
            <div class="header">
                <div class="brand-name">GoHolliday</div>
                <img id="nav-avatar" src="https://i.pravatar.cc/150?u=imam" style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover;">
            </div>
            
            <div class="category-scroll">
                <div class="pill active" onclick="filterData('Semua', this)">Semua</div>
                <div class="pill" onclick="filterData('Pantai', this)">Pantai</div>
                <div class="pill" onclick="filterData('Religi', this)">Religi</div>
                <div class="pill" onclick="filterData('Sejarah', this)">Sejarah</div>
                <div class="pill" onclick="filterData('Alam', this)">Alam</div>
            </div>
            <div id="tourList"></div>
        </div>

        <div id="profile" class="page">
            <div class="profile-hero">
                <img id="main-avatar" src="https://i.pravatar.cc/150?u=imam" class="avatar">
                <h2 id="display-name">Imam Mahdi</h2>
                <p id="display-status" style="color: var(--text-grey); font-size: 0.9rem;">MAMTECH Enthusiast</p>
            </div>
            
            <button class="btn-action" onclick="openModal()">
                <span><i class="fas fa-user-edit" style="margin-right:10px; color:var(--primary);"></i> Sunting Profil</span>
                <i class="fas fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
            </button>
            
            <button class="btn-action" style="color:var(--danger);" onclick="location.reload()">
                <span><i class="fas fa-sign-out-alt" style="margin-right:10px;"></i> Keluar</span>
            </button>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="navPage('home', this)"><i class="fas fa-compass"></i></div>
            <div class="nav-item"><i class="fas fa-heart"></i></div>
            <div class="nav-item"><i class="fas fa-bell"></i></div>
            <div class="nav-item" onclick="navPage('profile', this)"><i class="fas fa-user-circle"></i></div>
        </nav>
    </div>

    <script>
        const destinations = [
            { id: 1, name: "Gili Labak", cat: "Pantai", price: "Free*", img: "Gililabak.jpeg" },
            { id: 2, name: "Gili Iyang (Oksigen)", cat: "Alam", price: "Rp 15k", img: "Giliyang.jpeg" },
            { id: 3, name: "Pantai Sembilan", cat: "Pantai", price: "Rp 15k", img: "Sembilan.jpeg" },
            { id: 4, name: "Pantai Lombang", cat: "Pantai", price: "Rp 10k", img: "Lombang.jpeg" },
            { id: 5, name: "Pantai Slopeng", cat: "Pantai", price: "Rp 10k", img: "Slopeng.jpeg" },
            { id: 6, name: "Museum Keraton", cat: "Sejarah", price: "Rp 5k", img: "Kraton.jpeg" },
            { id: 7, name: "Masjid Agung", cat: "Religi", price: "Free", img: "Masjidjamik" },
            { id: 8, name: "Asta Tinggi", cat: "Religi", price: "Donasi", img: "Astatinggi.jpeg" },
            { id: 9, name: "Asta Sayyid Yusuf", cat: "Religi", price: "Donasi", img: "Astasayyidyusuf.jpeg" },
            { id: 10, name: "Bukit Tawap", cat: "Alam", price: "Rp 15k", img: "Bukittawaf" },
            { id: 11, name: "Daramista", cat: "Alam", price: "Rp 10k", img: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" },
            { id: 12, name: "Mangrove Kedatim", cat: "Alam", price: "Rp 10k", img: "Mangrovekedatim.jpeg" },
            { id: 13, name: "Taman Adipura", cat: "Sejarah", price: "Free", img: "Tamambunga.jpg" }
        ];

        // LOGIKA LOGIN
        function handleLogin() {
            document.getElementById('login-screen').style.transition = '0.5s';
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                renderList(destinations);
            }, 500);
        }

        // LOGIKA EDIT PROFIL
        function openModal() {
            document.getElementById('edit-modal').style.display = 'flex';
            document.getElementById('edit-name').value = document.getElementById('display-name').innerText;
            document.getElementById('edit-status').value = document.getElementById('display-status').innerText;
            document.getElementById('edit-pic').value = document.getElementById('main-avatar').src;
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function saveProfile() {
            const newName = document.getElementById('edit-name').value;
            const newStatus = document.getElementById('edit-status').value;
            const newPic = document.getElementById('edit-pic').value;

            if(newName) document.getElementById('display-name').innerText = newName;
            if(newStatus) document.getElementById('display-status').innerText = newStatus;
            if(newPic) {
                document.getElementById('main-avatar').src = newPic;
                document.getElementById('nav-avatar').src = newPic;
            }
            closeModal();
        }

        function renderList(data) {
            const list = document.getElementById('tourList');
            list.innerHTML = '';
            data.forEach(d => {
                list.innerHTML += `
                    <div class="tour-card">
                        <div class="price-label">${d.price}</div>
                        <img src="${d.img}" class="tour-img">
                        <div class="tour-content">
                            <span style="font-size:0.65rem; color:var(--primary); font-weight:800; text-transform:uppercase;">${d.cat}</span>
                            <h3 style="margin: 5px 0;">${d.name}</h3>
                            <p style="font-size: 0.8rem; color: var(--text-grey);"><i class="fas fa-map-marker-alt"></i> Sumenep, Madura</p>
                        </div>
                    </div>
                `;
            });
        }

        function filterData(cat, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'Semua' ? destinations : destinations.filter(d => d.cat === cat);
            renderList(filtered);
        }

        function navPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            el.classList.add('active');
        }
    </script>
</body>
</html>
